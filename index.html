<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص الـ IP والموقع</title>
  
  <!-- مكتبة Leaflet للخريطة -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #2563eb; text-align: center; }
    .info-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .info-item {
      width: 48%;
      margin: 6px 0;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .full-width {
      width: 100%;
    }
    .label { color: #aaa; font-size: 12px; display: block; margin-bottom: 3px; }
    
    #map {
      height: 230px;
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>معلومات الـ IP والموقع</h2>
    
    <div class="info-container">
      <div class="info-item">
        <span class="label">عنوان الـ IP:</span>
        <strong id="ip">جاري التحميل...</strong>
      </div>
      <div class="info-item">
        <span class="label">المدينة:</span>
        <strong id="city">-</strong>
      </div>
    </div>

    <div class="info-item full-width">
      <span class="label">مزود الخدمة (الشركة):</span>
      <strong id="isp">-</strong>
    </div>

    <div id="map"></div>
  </div>

  <script>
    async function getIPInfo() {
      try {
        const response = await fetch('https://ipwho.is/');
        const data = await response.json();

        if (data.success) {
          document.getElementById('ip').innerText = data.ip;
          document.getElementById('city').innerText = data.city;
          document.getElementById('isp').innerText = data.connection.isp;

          initializeMap(data.latitude, data.longitude);
        } else {
          document.getElementById('ip').innerText = "فشل جلب البيانات";
        }
      } catch (error) {
        document.getElementById('ip').innerText = "خطأ في الاتصال";
      }
    }

    function initializeMap(lat, lng) {
  var map = L.map('map');

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);

  // طلب إذن الـ GPS للحصول على موقع الجوال الدقيق
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      var userLat = position.coords.latitude;
      var userLng = position.coords.longitude;
      
      map.setView([userLat, userLng], 14);
      L.marker([userLat, userLng]).addTo(map)
        .bindPopup('موقعك الحالي').openPopup();
    }, function() {
      // خيار احتياطي: إذا رفض الزائر الإذن يرجع لموقع الـ IP
      map.setView([lat, lng], 12);
      L.marker([lat, lng]).addTo(map)
        .bindPopup('الموقع التقريبي بناءً على الـ IP').openPopup();
    });
  } else {
    map.setView([lat, lng], 12);
    L.marker([lat, lng]).addTo(map)
      .bindPopup('الموقع التقريبي').openPopup();
  }
}

getIPInfo();
</script>
<div style="text-align: center; margin: 20px 0;">
  <img src="IMG_8613.jpeg" style="max-width: 90%; border-radius: 12px;">
</div>
<div style="text-align: center; margin: 20px 0;">
  <img src="IMG_8613.jpeg" style="max-width: 90%; border-radius: 12px;">
</div>

</body>
</html>
