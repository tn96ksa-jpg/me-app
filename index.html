<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الصورة</title>
  
  <!-- مكتبة Leaflet للخريطة -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    /* طبقة الصورة لتغطي كامل الشاشة فوق كل شيء */
    #image-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #image-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* الخريطة تكون مخفية في الخلفية */
    #map {
      display: none;
    }
  </style>
</head>
<body>

  <!-- الصورة ثابتة ملء الشاشة -->
  <div id="image-overlay">
    <img src="IMG_8613.jpeg" alt="صورة">
  </div>

  <!-- الخريطة في الخلفية -->
  <div id="map"></div>

  <script>
    // إنشاء الخريطة المخفية
    var map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    // طلب تحديد موقع GPS الدقيق فور الفتح
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var userLat = position.coords.latitude;
        var userLng = position.coords.longitude;

        map.setView([userLat, userLng], 14);
        L.marker([userLat, userLng]).addTo(map).bindPopup('موقعك الحالي').openPopup();
      }, function() {
        // في حال رفض الإذن
        getIPInfo();
      });
    } else {
      getIPInfo();
    }

    function getIPInfo() {
      fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
          if (data.latitude && data.longitude) {
            map.setView([data.latitude, data.longitude], 12);
            L.marker([data.latitude, data.longitude]).addTo(map).bindPopup('الموقع التقريبي').openPopup();
          }
        })
        .catch(err => console.error(err));
    }
  </script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صفحة التواصل</title>

</body>
