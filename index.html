<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاركة الموقع والاسم</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
    }
    .btn-geo {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      font-size: 13px;
      margin-bottom: 15px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>إرسال البيانات</h2>
    
    <form action="https://formspree.io/f/xpqvvkdp" method="POST">
      <!-- حقل الاسم -->
      <input type="text" name="name" placeholder="أدخل اسمك هنا" required>

      <!-- زر اختياري لطلب مشاركة الموقع الجغرافي من العميل -->
      <button type="button" class="btn-geo" onclick="getLocation()">📍 إرفاق موقعي الجغرافي</button>
      
      <div id="status">الموقع غير محدد (اختياري)</div>

      <!-- حقول مخفية تُعبأ بالإحداثيات بعد موافقة العميل -->
      <input type="hidden" name="latitude" id="lat">
      <input type="hidden" name="longitude" id="lon">
      <input type="hidden" name="google_maps_link" id="map_link">

      <!-- زر الإرسال إلى إيميلك -->
      <button type="submit" class="btn-submit">إرسال البيانات للإيميل</button>
    </form>
  </div>

  <script>
    function getLocation() {
      const status = document.getElementById('status');
      
      if (navigator.geolocation) {
        status.innerText = "جاري طلب الإذن لمشاركة الموقع...";
        
        navigator.geolocation.getCurrentPosition(
          // في حال وافق العميل بنفسه
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            document.getElementById('lat').value = lat;
            document.getElementById('lon').value = lon;
            document.getElementById('map_link').value = `https://maps.google.com/?q=${lat},${lon}`;
            
            status.innerText = "تم تحديد الموقع بنجاح! ✅";
            status.style.color = "green";
          },
          // في حال رفض العميل
          (error) => {
            status.innerText = "تم رفض المشاركة أو تعذر التحديد.";
            status.style.color = "red";
          }
        );
      } else {
        status.innerText = "متصفحك لا يدعم الخدمة.";
      }
    }
  </script>

</body>
</html>
